name: Release Implementation
on:
  workflow_call:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Validate bump input
        run: |
          case "${{ inputs.bump }}" in
            patch|minor|major) ;;
            *) echo "Invalid bump value: '${{ inputs.bump }}'. Must be patch, minor, or major." >&2; exit 1 ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bump version
        id: version
        run: |
          MARKETING_VERSION=$(grep '^MARKETING_VERSION=' version.env | cut -d= -f2)
          BUILD_NUMBER=$(grep '^BUILD_NUMBER=' version.env | cut -d= -f2)
          IFS='.' read -r major minor patch <<< "$MARKETING_VERSION"

          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          NEW_VERSION="${major}.${minor}.${patch}"
          NEW_BUILD=$((BUILD_NUMBER + 1))

          echo "MARKETING_VERSION=${NEW_VERSION}" > version.env
          echo "BUILD_NUMBER=${NEW_BUILD}" >> version.env

          # Update package.json version
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '${NEW_VERSION}';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${NEW_BUILD}" >> "$GITHUB_OUTPUT"
          echo "Bumped to v${NEW_VERSION} (build ${NEW_BUILD})"

      - name: Install dependencies
        run: npm ci

      - name: Build binaries (amd64 + arm64, macOS + Linux) + tarballs
        id: tarballs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Bake the version into each standalone binary (they can't read package.json
          # at runtime). Value is a JS string literal for bun --define.
          VDEF=$(printf '__CHECKERS60_VERSION__="%s"' "$VERSION")

          # <bun-target> <artifact-suffix> — build, tarball, sha, emit outputs.
          build() {
            local target="$1" suffix="$2"
            bun build --compile --target="$target" --define "$VDEF" src/cli.ts --outfile checkers60
            local tar="checkers60-v${VERSION}-${suffix}.tar.gz"
            tar -czf "$tar" checkers60
            rm -f checkers60
            local sha
            sha=$(shasum -a 256 "$tar" | awk '{print $1}')
            local key="${suffix//-/_}"
            echo "${key}_tar=${tar}" >> "$GITHUB_OUTPUT"
            echo "${key}_sha=${sha}" >> "$GITHUB_OUTPUT"
            echo "${suffix}: ${sha}  (${tar})"
          }

          build bun-darwin-arm64 darwin-arm64
          build bun-darwin-x64   darwin-amd64
          build bun-linux-x64    linux-amd64
          build bun-linux-arm64  linux-arm64

      - name: Commit version bump (verified, via GitHub API)
        env:
          # GITHUB_TOKEN is the GitHub Actions integration and cannot bypass the
          # main-branch ruleset (PR-required + signed commits). A bypass-user PAT
          # can, and createCommitOnBranch produces a GitHub-signed ("Verified")
          # commit that also satisfies require-signed-commits. The release tag is
          # created afterwards by the "Create GitHub Release" step.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${GITHUB_REF_NAME}"
          HEAD_OID=$(git rev-parse HEAD)

          additions=$(jq -n \
            --arg p1 version.env  --arg c1 "$(base64 < version.env | tr -d '\n')" \
            --arg p2 package.json --arg c2 "$(base64 < package.json | tr -d '\n')" \
            '[{path:$p1,contents:$c1},{path:$p2,contents:$c2}]')

          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg branch "$BRANCH" \
            --arg oid "$HEAD_OID" \
            --arg headline "chore(release): bump version to ${VERSION}" \
            --argjson additions "$additions" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: $headline},
                fileChanges: {additions: $additions}
              }}}' \
            | gh api graphql --input -

      - name: Create GitHub Release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="### Install"$'\n'"brew install yashiels/tap/checkers60"$'\n\n'"Or download a tarball below (macOS + Linux, amd64 + arm64)."$'\n\n'"**SHA-256**"$'\n'"- darwin-arm64: ${{ steps.tarballs.outputs.darwin_arm64_sha }}"$'\n'"- darwin-amd64: ${{ steps.tarballs.outputs.darwin_amd64_sha }}"$'\n'"- linux-amd64: ${{ steps.tarballs.outputs.linux_amd64_sha }}"$'\n'"- linux-arm64: ${{ steps.tarballs.outputs.linux_arm64_sha }}"
          gh release create "v${VERSION}" \
            "${{ steps.tarballs.outputs.darwin_arm64_tar }}" \
            "${{ steps.tarballs.outputs.darwin_amd64_tar }}" \
            "${{ steps.tarballs.outputs.linux_amd64_tar }}" \
            "${{ steps.tarballs.outputs.linux_arm64_tar }}" \
            --title "checkers60 v${VERSION}" \
            --generate-notes \
            --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap (signed commit)
        env:
          # HOMEBREW_TAP_TOKEN is owned by a bypass user, so createCommitOnBranch
          # lands a GitHub-signed ("Verified") commit that also satisfies the
          # tap's branch ruleset — unlike a plain github-actions[bot] git push.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAP="yashiels/homebrew-tap"
          BRANCH="main"
          FORMULA="checkers60"
          export DARWIN_ARM64_SHA="${{ steps.tarballs.outputs.darwin_arm64_sha }}"
          export DARWIN_AMD64_SHA="${{ steps.tarballs.outputs.darwin_amd64_sha }}"
          export LINUX_AMD64_SHA="${{ steps.tarballs.outputs.linux_amd64_sha }}"
          export LINUX_ARM64_SHA="${{ steps.tarballs.outputs.linux_arm64_sha }}"

          python3 -c "
          import os, textwrap
          v = '${VERSION}'
          base = 'https://github.com/yashiels/checkers60-cli/releases/download/v' + v
          d_arm, d_amd = os.environ['DARWIN_ARM64_SHA'], os.environ['DARWIN_AMD64_SHA']
          l_amd, l_arm = os.environ['LINUX_AMD64_SHA'], os.environ['LINUX_ARM64_SHA']
          formula = f'''class Checkers60 < Formula
            desc \"CLI for Checkers Sixty60 grocery delivery\"
            homepage \"https://github.com/yashiels/checkers60-cli\"
            version \"{v}\"

            on_macos do
              if Hardware::CPU.arm?
                url \"{base}/checkers60-v{v}-darwin-arm64.tar.gz\"
                sha256 \"{d_arm}\"
              else
                url \"{base}/checkers60-v{v}-darwin-amd64.tar.gz\"
                sha256 \"{d_amd}\"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url \"{base}/checkers60-v{v}-linux-arm64.tar.gz\"
                sha256 \"{l_arm}\"
              else
                url \"{base}/checkers60-v{v}-linux-amd64.tar.gz\"
                sha256 \"{l_amd}\"
              end
            end

            def install
              bin.install \"checkers60\"
            end

            test do
              system bin/\"checkers60\", \"--version\"
            end
          end
          '''
          open('formula.rb', 'w').write(textwrap.dedent(formula).lstrip())
          "

          b64=$(base64 < formula.rb | tr -d '\n')

          for attempt in 1 2 3 4 5; do
            oid=$(gh api "repos/${TAP}/git/ref/heads/${BRANCH}" --jq '.object.sha')
            payload=$(jq -n \
              --arg repo "$TAP" --arg branch "$BRANCH" --arg oid "$oid" \
              --arg headline "${FORMULA}: update formula for v${VERSION}" \
              --arg path "Formula/${FORMULA}.rb" --arg c "$b64" \
              '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
                variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $branch}, expectedHeadOid: $oid, message: {headline: $headline}, fileChanges: {additions: [{path: $path, contents: $c}]}}}}')
            if out=$(printf '%s' "$payload" | gh api graphql --input - 2>&1); then
              url=$(printf '%s' "$out" | jq -r '.data.createCommitOnBranch.commit.url // empty')
              if [ -n "$url" ]; then echo "Homebrew tap updated (verified): $url"; exit 0; fi
              echo "attempt $attempt: no commit in response: $out"
            else
              echo "attempt $attempt failed: $out"
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to update Homebrew tap after retries" >&2
          exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: checkers60-v${{ steps.version.outputs.version }}-binaries
          path: |
            ${{ steps.tarballs.outputs.darwin_arm64_tar }}
            ${{ steps.tarballs.outputs.darwin_amd64_tar }}
            ${{ steps.tarballs.outputs.linux_amd64_tar }}
            ${{ steps.tarballs.outputs.linux_arm64_tar }}
